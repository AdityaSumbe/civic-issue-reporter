spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/civic_issue_db
    username: ${DB_USERNAME:civic_user}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info