spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/civic_issue_db
    username: civic_user
    password: civic_password

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

jwt:
  secret: ${JWT_SECRET:change-this-development-secret-key-to-a-long-random-value}
  expiration: 86400000

app:
  admin:
    email: ${ADMIN_EMAIL:admin@civic.local}
    password: ${ADMIN_PASSWORD:}
  officer:
    email: ${OFFICER_EMAIL:}
    password: ${OFFICER_PASSWORD:}