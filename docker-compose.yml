services:
  postgres:
    image: postgres:16
    container_name: civic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:civic_issue_db}
      POSTGRES_USER: ${POSTGRES_USER:civic_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: